<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">ChromaTray — Pick a pixel. Find your palette.</title>
  <desc id="desc">Illustration of the screen color picker, with blue, green, pink, amber and purple palette swatches.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12141e"/><stop offset="1" stop-color="#222536"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#3b82f6"/><stop offset=".5" stop-color="#10b981"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  </defs>
  <rect width="1120" height="380" rx="24" fill="url(#bg)"/>
  <rect x="40" y="40" width="44" height="44" rx="13" fill="#18181c"/>
  <circle cx="56" cy="56" r="11" fill="#3b82f6"/><circle cx="70" cy="58" r="11" fill="#10b981"/>
  <circle cx="63" cy="71" r="11" fill="#f43f5e" stroke="white"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="100" y="69" fill="#a7afc6" font-size="14" letter-spacing="3">YOUR SCREEN. YOUR COLORS.</text>
    <text x="40" y="161" fill="#f4f6ff" font-size="64" font-weight="700" letter-spacing="-2">ChromaTray</text>
    <text x="43" y="208" fill="#b8c0d9" font-size="23">Pick a pixel. Find your palette.</text>
    <rect x="43" y="242" width="350" height="3" rx="1.5" fill="url(#line)"/>
    <rect x="43" y="276" width="142" height="33" rx="8" fill="#26375b"/>
    <text x="60" y="298" fill="#a9caff" font-size="13" font-weight="600">POINT PICKER</text>
    <rect x="197" y="276" width="158" height="33" rx="8" fill="#173d35"/>
    <text x="214" y="298" fill="#8ce6c9" font-size="13" font-weight="600">REGION PALETTES</text>
    <text x="43" y="344" fill="#7b869f" font-size="12">WINDOWS 10 / 11   ·   .NET 8   ·   NATIVE DESKTOP</text>
    <rect x="638" y="40" width="438" height="300" rx="16" fill="#181b29" stroke="#353a50"/>
    <text x="664" y="75" fill="#e9edff" font-size="15" font-weight="600">A palette, one selection away.</text>
    <text x="664" y="99" fill="#8590aa" font-size="12">ILLUSTRATIVE PALETTE</text>
    <rect x="664" y="120" width="78" height="136" rx="10" fill="#3b82f6"/>
    <rect x="748" y="120" width="68" height="136" rx="10" fill="#10b981"/>
    <rect x="822" y="120" width="68" height="136" rx="10" fill="#f43f5e"/>
    <rect x="896" y="120" width="68" height="136" rx="10" fill="#f59e0b"/>
    <rect x="970" y="120" width="80" height="136" rx="10" fill="#8b5cf6"/>
    <text x="664" y="288" fill="#e9edff" font-family="Consolas, monospace" font-size="17">#3B82F6</text>
    <text x="664" y="313" fill="#8590aa" font-size="12">HEX  /  RGB  /  HSL  /  HSV  /  CMYK</text>
    <rect x="966" y="275" width="84" height="39" rx="8" fill="#3b82f6"/>
    <text x="989" y="300" fill="#fff" font-size="14" font-weight="600">Copy</text>
  </g>
</svg>
